name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-sidecar:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            pyinstaller_os: macos
          - os: macos-13
            target: x86_64-apple-darwin
            pyinstaller_os: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pyinstaller_os: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar binary
        run: pyinstaller desktop/pyinstaller.spec --distpath desktop/src-tauri/binaries/

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: |
          mv desktop/src-tauri/binaries/astermem-server \
             desktop/src-tauri/binaries/astermem-server-${{ matrix.target }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: |
          mv desktop/src-tauri/binaries/astermem-server.exe `
             desktop/src-tauri/binaries/astermem-server-${{ matrix.target }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: desktop/src-tauri/binaries/astermem-server-*

  build-desktop:
    needs: build-sidecar
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: desktop/src-tauri/binaries/

      - name: Make sidecar executable (unix)
        if: runner.os != 'Windows'
        run: chmod +x desktop/src-tauri/binaries/astermem-server-*

      - name: Build web UI
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
